<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .book {
            background: #f0f0f0;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        h1 {
            color: #333;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Book Information</h1>

        <p id="firstBook"></p>
        <p id="secondBook"></p>

        <h2>Book Genres</h2>
        <div id="genres"></div>

        <p id="error"></p>
    </div>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to retrieve book data.");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) ||
                    data.books.length < 2) {
                    throw new Error("Invalid book data.");
                }

                const first = data.books[0];
                const second = data.books[1];

                // (a) Display first book title
                document.getElementById("firstBook")
                    .textContent = "First Book Title: " + first.title;

                // (b) Display second book author
                document.getElementById("secondBook")
                    .textContent = "Second Book Author: " + second.author;

                // (c) Display genres of both books
                const genreContainer =
                    document.getElementById("genres");

                [first, second].forEach(book => {
                    const bookDiv = document.createElement("div");
                    bookDiv.className = "book";

                    const heading = document.createElement("h3");
                    heading.textContent = book.title;

                    const genreText = document.createElement("p");
                    genreText.textContent =
                        "Genres: " + book.genres.join(", ");

                    bookDiv.appendChild(heading);
                    bookDiv.appendChild(genreText);

                    genreContainer.appendChild(bookDiv);
                });

            } catch (error) {
                document.getElementById("error")
                    .textContent = "Error: " + error.message;
            }
        }

        loadBooks();
    </script>

</body>
</html>
