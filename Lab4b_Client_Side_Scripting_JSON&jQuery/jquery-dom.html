<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery DOM Manipulation</title>

    <!-- jQuery 4.0.0 Full Build CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .myStyle {
            background-color: coral;
            padding: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>jQuery DOM Manipulation</h1>

    <div id="myElement">Original Text</div>

    <br>

    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <button id="myButton">Click me</button>

    <script>

        // (a) Change the text using jQuery
        $("#myElement").text("Modified Text");

        // (b) Add the CSS class using jQuery
        $("#myDIV").addClass("myStyle");

        // (c) Handle button click using jQuery
        $("#myButton").on("click", function() {
            alert("Button clicked!");
        });

    </script>

</body>
</html>
